<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard</title>
<style>
  :root { --ink:#1f1a17; --muted:#5d5550; --paper:#fffdf9; --card:#ffffff; --line:#e6ddd2;
          --accent:#2F7F7A; --draft:#b45309; --draft-bg:#fff4e5; --ok:#166534; --ok-bg:#e9f7ee; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--paper); }
  header { padding:20px 20px 8px; }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  .meta { color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.9rem; }
  .banner { margin:12px 20px; padding:12px 16px; border-radius:10px; font-weight:700; border:2px solid; }
  .banner.draft { color:var(--draft); background:var(--draft-bg); border-color:var(--draft); }
  .banner.approved { color:var(--ok); background:var(--ok-bg); border-color:var(--ok); }
  .banner small { display:block; font-weight:400; color:var(--ink); margin-top:4px; }
  .timing { margin:0 20px 8px; font-size:.9rem; }
  .timing.bad { color:#b91c1c; font-weight:700; }
  .bar { display:flex; height:10px; margin:0 20px 16px; border-radius:6px; overflow:hidden; border:1px solid var(--line); }
  .bar span { display:block; height:100%; border-right:1px solid #fff; }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; padding:0 20px 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
  .card h2 { margin:0; font-size:1rem; display:flex; justify-content:space-between; gap:8px; }
  .chip { display:inline-block; font-size:.75rem; padding:2px 8px; border-radius:999px; background:#eef5f4; color:var(--accent); font-weight:600; margin:0 4px 4px 0; }
  .frame { aspect-ratio:9/16; max-height:150px; border:2px dashed var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:.8rem; text-align:center; padding:6px; align-self:center; width:auto; }
  .frame.h { aspect-ratio:16/9; max-height:none; width:100%; }
  dl { margin:0; display:grid; grid-template-columns:92px 1fr; gap:3px 8px; font-size:.88rem; }
  dt { color:var(--muted); font-weight:600; }
  dd { margin:0; }
  .prompt { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.8rem; background:#f7f3ee; border-radius:6px; padding:6px 8px; white-space:pre-wrap; }
  label.note { font-size:.8rem; color:var(--muted); }
  textarea { width:100%; min-height:44px; font:inherit; font-size:.85rem; border:1px solid var(--line); border-radius:6px; padding:6px; }
  footer { padding:0 20px 28px; }
  button { font:inherit; font-weight:700; padding:10px 16px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  button:focus-visible, textarea:focus-visible { outline:3px solid #f59e0b; outline-offset:2px; }
  #out { margin-top:10px; display:none; }
  ul.log { color:var(--muted); font-size:.85rem; }
  @media print { textarea, footer button { display:none; } .card { break-inside:avoid; } }
</style>
</head>
<body>

<header>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
</header>
<div class="banner" id="banner" role="status"></div>
<p class="timing" id="timing"></p>
<div class="bar" id="bar" aria-hidden="true"></div>
<main id="grid" aria-label="Shot cards"></main>
<footer>
  <button type="button" id="copyfb">Copy feedback for Claude</button>
  <textarea id="out" readonly aria-label="Feedback text to paste into the chat"></textarea>
  <h3>Changelog</h3>
  <ul class="log" id="log"></ul>
</footer>

<script>
(function () {
  var d = JSON.parse(document.getElementById('storyboard-data').textContent);
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var approved = String(d.status).toUpperCase() === 'APPROVED';
  document.title = 'Storyboard: ' + d.title + ' v' + d.version + (approved ? ' (APPROVED)' : ' (DRAFT)');
  document.getElementById('title').textContent = d.title;
  document.getElementById('meta').innerHTML = ['Project: ' + esc(d.project), 'Platform: ' + esc(d.platform), 'Aspect: ' + esc(d.aspect), 'Target: ' + esc(d.target_seconds) + ' s', 'Version ' + esc(d.version), d.shots.length + ' shots'].map(function (x) { return '<span>' + x + '</span>'; }).join('');
  var b = document.getElementById('banner');
  if (approved) { b.className = 'banner approved'; b.innerHTML = 'Status: APPROVED' + '<small>Approved ' + esc(d.approved_at) + (d.approved_by ? ' by ' + esc(d.approved_by) : '') + '. Locked for production in Higgsfield.</small>'; }
  else { b.className = 'banner draft'; b.innerHTML = 'Status: DRAFT, awaiting your approval' + '<small>Reply <b>APPROVE</b> in the chat to lock it, or add notes below each shot and press "Copy feedback for Claude".</small>'; }
  var total = d.shots.reduce(function (a, s) { return a + Number(s.duration || 0); }, 0);
  var t = document.getElementById('timing');
  var off = Math.abs(total - Number(d.target_seconds));
  t.textContent = 'Timing: shots add up to ' + total.toFixed(1) + ' s of ' + d.target_seconds + ' s target' + (off > 0.5 ? ' (off by ' + off.toFixed(1) + ' s: fix before approval)' : ' (on target)');
  if (off > 0.5) t.className = 'timing bad';
  var palette = ['#2F7F7A', '#6B4226', '#c08a3e', '#4b6c9c', '#8a5a8c', '#7a8c3e'];
  document.getElementById('bar').innerHTML = d.shots.map(function (s) { return '<span title="' + esc(s.id) + '" style="width:' + (100 * s.duration / total) + '%;background:' + palette[(s.scene - 1) % palette.length] + '"></span>'; }).join('');
  var vertical = /9:16|4:5|1:1/.test(d.aspect);
  document.getElementById('grid').innerHTML = d.shots.map(function (s, i) {
    return '<article class="card" aria-labelledby="h' + i + '">' +
      '<h2 id="h' + i + '"><span>' + esc(s.id) + '</span><span>' + esc(s.start) + '–' + esc(s.end) + ' s (' + esc(s.duration) + ' s)</span></h2>' +
      '<div><span class="chip">' + esc(s.size) + '</span><span class="chip">' + esc(s.angle) + '</span><span class="chip">' + esc(s.move) + '</span>' + (s.effect ? '<span class="chip">' + esc(s.effect) + '</span>' : '') + '<span class="chip">in: ' + esc(s.transition_in) + '</span></div>' +
      '<div class="frame' + (vertical ? '' : ' h') + '">Frame ' + esc(s.id) + '<br>' + esc(s.size) + '</div>' +
      '<dl><dt>Action</dt><dd>' + esc(s.action) + '</dd>' +
      '<dt>Dialogue/VO</dt><dd>' + (esc(s.dialogue) || '—') + '</dd>' +
      '<dt>On-screen</dt><dd>' + (esc(s.onscreen) || '—') + '</dd>' +
      '<dt>SFX/music</dt><dd>' + (esc(s.audio) || '—') + '</dd>' +
      '<dt>Assets</dt><dd>' + (esc(s.assets) || '—') + '</dd></dl>' +
      '<div class="prompt" aria-label="Higgsfield prompt">' + esc(s.prompt) + '</div>' +
      '<label class="note" for="n' + i + '">Your note on ' + esc(s.id) + '</label><textarea id="n' + i + '" data-id="' + esc(s.id) + '" placeholder="e.g. make this a Crash Zoom In"></textarea>' +
      '</article>';
  }).join('');
  document.getElementById('log').innerHTML = (d.changelog || []).map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('');
  document.getElementById('copyfb').addEventListener('click', function () {
    var notes = Array.prototype.slice.call(document.querySelectorAll('textarea[data-id]')).filter(function (x) { return x.value.trim(); }).map(function (x) { return x.getAttribute('data-id') + ': ' + x.value.trim(); });
    var text = notes.length ? 'Storyboard v' + d.version + ' changes:\n' + notes.join('\n') : 'APPROVE storyboard v' + d.version;
    var out = document.getElementById('out'); out.style.display = 'block'; out.value = text; out.focus(); out.select();
    var btn = this;
    var done = function () { btn.textContent = 'Copied! Paste it into the chat'; };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, function () { document.execCommand('copy'); done(); }); }
    else { try { document.execCommand('copy'); done(); } catch (e) { btn.textContent = 'Select the text below and copy it'; } }
  });
})();
</script>
